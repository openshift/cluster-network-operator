apiVersion: v1
data:
  nginx.conf: |
    error_log /dev/stdout info;
    events {}
    http {
      include            /etc/nginx/mime.types;
      default_type       application/octet-stream;
      keepalive_timeout  65;
      # Certificate paths containing a variable are loaded on every full TLS
      # handshake (not on every HTTP request or resumed session), so a rotated
      # serving certificate in the mounted secret is used without restarting
      # or reloading nginx, at the cost of extra CPU per full handshake.
      # The map input is a constant empty string, so the directory never
      # depends on client-supplied values such as SNI.
      map "" $plugin_certificate_dir { default /var/cert; }
      server {
        listen              9443 ssl;
        listen              [::]:9443 ssl;
        ssl_certificate     $plugin_certificate_dir/tls.crt;
        ssl_certificate_key $plugin_certificate_dir/tls.key;
{{- if .UseTLSProfile }}
        ssl_protocols       {{.NginxTLSProtocols}};
{{- if .NginxTLSCiphers }}
        ssl_ciphers         {{.NginxTLSCiphers}};
{{- end }}
        ssl_prefer_server_ciphers on;
{{- end }}
        root                /opt/app-root/src;

        # Prevent caching for plugin-manifest.json
        location = /plugin-manifest.json {
          add_header Cache-Control 'no-cache, no-store, must-revalidate, proxy-revalidate, max-age=0';
          add_header Pragma 'no-cache';
          add_header Expires '0';
        }

        # Prevent caching for plugin-entry.js
        location = /plugin-entry.js {
          add_header Cache-Control 'no-cache, no-store, must-revalidate, proxy-revalidate, max-age=0';
          add_header Pragma 'no-cache';
          add_header Expires '0';
        }
      }
    }
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/component: networking-console-plugin
    app.kubernetes.io/managed-by: cluster-network-operator
    app.kubernetes.io/name: networking-console-plugin
    app.kubernetes.io/part-of: cluster-network-operator
  name: networking-console-plugin
  namespace: openshift-network-console
